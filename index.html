    <style>
        /* -------- Theme tokens -------- */
        html,
        body {
            width: 100svw;
            height: 100svh;
            margin: 0;
            /* Black baseline so screen is fully black before reveal */
            background: #ffffff;
            color: #000000;
            font-family:
                ui-sans-serif,
                system-ui,
                -apple-system,
                Segoe UI,
                Roboto,
                Ubuntu,
                Cantarell,
                Noto Sans;
            font-size: 34px;
        }

        /* Fullscreen viewport */
        #viewport {
            position: fixed;
            inset: 0;
        }

        #viewport #renderer {
            width: 100%;
            height: 100%;
        }

        #viewport #overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .hidden {
            display: none !important;
        }

        /* ------------------------- Boot / Loader UI ------------------------- */
        #boot {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999;
            flex-direction: column;
        }

        /* Reveal overlay SVG */
        .reveal {
            z-index: 2147483647; /* above boot and everything else */
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; /* never intercept input */
        }
        .reveal #star {
            transform-box: fill-box;
            transform-origin: 50% 50%;
            transform: scale(0.01);
            /* Animate in ~0.9s (was 90s) */
            transition: transform 200000ms cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .reveal.open #star {
            transform: scale(30);
        }
        @media (prefers-reduced-motion: reduce) {
            .reveal #star,
            .reveal.open #star {
                transition: none;
                transform: scale(30);
            }
        }
    </style>
